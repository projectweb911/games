<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mencocokkan Rasa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
            padding: 30px 15px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* =========================
           LAYOUT UTAMA
        ========================= */

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 230px;
            gap: 25px;
            align-items: start;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .column {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .column h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #444;
        }

        /* =========================
           GAMBAR
        ========================= */

        .images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .image-item {
            background: white;
            border: 3px solid #ddd;
            border-radius: 15px;
            padding: 10px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            transition: 0.3s;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .image-item:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .dragging {
            opacity: 0.5;
        }

        .matched {
            opacity: 0.4;
            cursor: default;
            border-color: #28a745;
        }

        /* =========================
           DROP ZONE
        ========================= */

        .drop-zone {
            background: white;
            border: 3px dashed #bbb;
            border-radius: 15px;
            min-height: 160px;
            margin-bottom: 15px;
            padding: 15px;
            transition: 0.3s;
        }

        .drop-zone-title {
            text-align: center;
            color: #666;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .drop-zone.drag-over {
            border-color: #667eea;
            background: #eef1ff;
            transform: scale(1.02);
        }

        .drop-zone.correct {
            border-color: #28a745;
            background: #eaffee;
        }

        .drop-zone.wrong {
            border-color: #dc3545;
            background: #ffecec;
            animation: shake 0.4s;
        }

        .matched-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .matched-images img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 5px;
            border: 2px solid #28a745;
        }

        /* =========================
           PANEL INFORMASI KANAN
        ========================= */

        .info-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 18px;
            position: sticky;
            top: 20px;
        }

        .info-panel h2 {
            text-align: center;
            color: #444;
            margin-bottom: 18px;
            font-size: 21px;
        }

        .info-box {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: center;
            border: 2px solid #ddd;
        }

        .info-icon {
            font-size: 32px;
            margin-bottom: 7px;
        }

        .info-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-text {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .info-box.wrong-info {
            border-color: #dc3545;
        }

        .info-box.correct-info {
            border-color: #28a745;
        }

        .reset-button {
            width: 100%;
            border: none;
            background: #667eea;
            color: white;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .reset-button:hover {
            background: #5568d9;
            transform: translateY(-2px);
        }

        /* =========================
           PESAN AKTIF
        ========================= */

        .current-message {
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            min-height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .current-message.success {
            color: #155724;
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .current-message.error {
            color: #721c24;
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        /* =========================
           ANIMASI
        ========================= */

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-8px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 950px) {

            .main-layout {
                grid-template-columns: 1fr;
            }

            .info-panel {
                position: static;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .info-panel h2 {
                grid-column: 1 / -1;
            }

            .info-box {
                margin-bottom: 0;
            }

            .reset-button {
                margin-top: 0;
            }
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
            }

            .game-area {
                grid-template-columns: 1fr;
            }

            .images {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-item {
                height: 130px;
            }

            .matched-images img {
                height: 80px;
            }

            .info-panel {
                grid-template-columns: 1fr;
            }

            .info-panel h2 {
                grid-column: auto;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body oncontextmenu="return false;">

<div class="container">

    <h1>🎯 MATCHING: CULINARY & ME</h1>

    <p class="subtitle">
        DRAG THE PICTURE ARE SUCCESSFULLY MATCHED!
    </p>


    <div class="main-layout">


        <!-- =========================
             AREA GAME
        ========================== -->

        <div class="game-area">


            <!-- GAMBAR -->

            <div class="column">

                <h2>🖼️ FOOD PICTURES</h2>

                <div class="images" id="imageContainer">


                    <!-- SWEET -->

                    <div class="image-item"

                    <!-- SOUR -->

                    <div class="image-item"

                    <div class="image-item"

                         data-id="sour2">

                        <img src="OIP (3).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="sour3">

                        <img src="OIP (4).jfif">

                    </div>


                    <!-- SALTY -->

                    <div class="image-item"
                         draggable="true"
                         data-id="salty1">

                        <img src="OIP1.jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="salty2">

                        <img src="OIP2.jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="salty3">

                        <img src="OIP (5).jfif">

                    </div>


                    <!-- BITTER -->

                    <div class="image-item"
                         draggable="true"
                         data-id="bitter1">

                        <img src="OIP (6).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="bitter2">

                        <img src="OIP (7).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="bitter3">

                        <img src="OIP (8).jfif">

                    </div>


                    <!-- SPICY -->

                    <div class="image-item"
                         draggable="true"
                         data-id="spicy1">

                        <img src="OIP (9).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="spicy2">

                        <img src="OIP (10).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="spicy3">

                        <img src="OIP (11).jfif">

                    </div>


                    <!-- UMAMI -->

                    <div class="image-item"
                         draggable="true"
                         data-id="umami1">

                        <img src="OIP (12).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="umami2">

                        <img src="OIP (13).jfif">

                    </div>

                    <div class="image-item"
                         draggable="true"
                         data-id="umami3">

                        <img src="OIP (14).jfif">

                    </div>

                </div>

            </div>


            <!-- KATEGORI -->

            <div class="column">

                <h2>🎯 Match the Taste</h2>


                <div class="drop-zone"
                     data-id="sweet">

                    <div class="drop-zone-title">
                        🍬 Sweet
                    </div>

                    <div class="matched-images"></div>

                </div>


                <div class="drop-zone"
                     data-id="sour">

                    <div class="drop-zone-title">
                        🍋 Sour
                    </div>

                    <div class="matched-images"></div>

                </div>


                <div class="drop-zone"
                     data-id="salty">

                    <div class="drop-zone-title">
                        🧂 Salty
                    </div>

                    <div class="matched-images"></div>

                </div>


                <div class="drop-zone"
                     data-id="bitter">

                    <div class="drop-zone-title">
                        🍫 Bitter
                    </div>

                    <div class="matched-images"></div>

                </div>


                <div class="drop-zone"
                     data-id="spicy">

                    <div class="drop-zone-title">
                        🌶️ Spicy
                    </div>

                    <div class="matched-images"></div>

                </div>


                <div class="drop-zone"
                     data-id="umami">

                    <div class="drop-zone-title">
                        🍜 Savory / Umami
                    </div>

                    <div class="matched-images"></div>

                </div>

            </div>

        </div>


        <!-- =========================
             PANEL INFORMASI KANAN
        ========================== -->

        <div class="info-panel">

            <h2>📌 INFORMATION</h2>



            <button class="reset-button"
                    onclick="resetGame()">

                🔄 RESTART!

            </button>


            <div class="current-message"
                 id="message">

                Silakan mulai mencocokkan
                gambar.

            </div>

        </div>

    </div>

</div>


<script>

    let draggedItem = null;

    let correct = 0;


    const imageItems =
        document.querySelectorAll(".image-item");

    const dropZones =
        document.querySelectorAll(".drop-zone");

    const message =
        document.getElementById("message");


    /* =========================
       DRAG START
    ========================= */

    imageItems.forEach(item => {

        item.addEventListener("dragstart", function(e) {

            if (item.classList.contains("matched")) {

                e.preventDefault();

                return;

            }

            draggedItem = item;

            setTimeout(() => {

                item.classList.add("dragging");

            }, 0);

        });


        item.addEventListener("dragend", function() {

            item.classList.remove("dragging");

        });

    });


    /* =========================
       DROP ZONE
    ========================= */

    dropZones.forEach(zone => {

        zone.addEventListener("dragover", function(e) {

            e.preventDefault();


            const matchedImages =
                zone.querySelector(".matched-images");


            const currentCount =
                matchedImages
                .querySelectorAll("img")
                .length;


            if (currentCount >= 3) {

                return;

            }


            zone.classList.add("drag-over");

        });


        zone.addEventListener("dragleave", function() {

            zone.classList.remove("drag-over");

        });


        zone.addEventListener("drop", function(e) {

            e.preventDefault();

            zone.classList.remove("drag-over");


            if (!draggedItem) {

                return;

            }


            const matchedImages =
                zone.querySelector(".matched-images");


            const currentCount =
                matchedImages
                .querySelectorAll("img")
                .length;


            if (currentCount >= 3) {

                showError(
                    "⚠️ Kategori ini sudah penuh!"
                );

                draggedItem = null;

                return;

            }


            const imageID =
                draggedItem.dataset.id;


            const targetID =
                zone.dataset.id;


            const imageTaste =
                imageID.replace(/[0-9]/g, "");


            /* =========================
               BENAR
            ========================= */

            if (imageTaste === targetID) {

                correct++;


                const clonedImage =
                    draggedItem
                    .querySelector("img")
                    .cloneNode(true);


                matchedImages.appendChild(
                    clonedImage
                );


                draggedItem.classList.add(
                    "matched"
                );


                draggedItem.draggable =
                    false;


                if (
                    matchedImages
                    .querySelectorAll("img")
                    .length === 3
                ) {

                    zone.classList.add(
                        "correct"
                    );

                }


                showSuccess(
                    "✅ CORRECT ANSWER! GOOD JOB!"
                );


                if (correct === 18) {

                    setTimeout(() => {

                        showSuccess(
                            "🎉 CONGRATULATION! ALL OF PICTURE ARE 🎉"
                        );

                    }, 500);

                }

            }


            /* =========================
               SALAH
            ========================= */

            else {

                zone.classList.add("wrong");


                showError(
                    "❌ INCORECT ANSWER! TRY AGAIN!"
                );


                setTimeout(() => {

                    zone.classList.remove(
                        "wrong"
                    );

                }, 500);

            }


            draggedItem = null;

        });

    });


    /* =========================
       PESAN BENAR
    ========================= */

    function showSuccess(text) {

        message.textContent = text;

        message.className =
            "current-message success";

    }


    /* =========================
       PESAN SALAH
    ========================= */

    function showError(text) {

        message.textContent = text;

        message.className =
            "current-message error";

    }


    /* =========================
       ACAK GAMBAR
    ========================= */

    function shuffleImages() {

        const container =
            document.getElementById(
                "imageContainer"
            );


        const items =
            Array.from(
                container.children
            );


        items.sort(
            () => Math.random() - 0.5
        );


        items.forEach(item => {

            container.appendChild(item);

        });

    }


    /* =========================
       RESET GAME
    ========================= */

    function resetGame() {

        correct = 0;


        message.textContent =
            "Silakan mulai mencocokkan gambar.";


        message.className =
            "current-message";


        imageItems.forEach(item => {

            item.classList.remove(
                "matched"
            );

            item.classList.remove(
                "dragging"
            );

            item.draggable = true;

        });


        dropZones.forEach(zone => {

            zone.classList.remove(
                "correct"
            );

            zone.classList.remove(
                "wrong"
            );

            zone.classList.remove(
                "drag-over"
            );


            const matchedImages =
                zone.querySelector(
                    ".matched-images"
                );


            matchedImages.innerHTML = "";

        });


        shuffleImages();

    }


    /* =========================
       ACAK SAAT PERTAMA
    ========================= */

    shuffleImages();

</script>

</body>
</html>
